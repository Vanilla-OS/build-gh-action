name: 'Vanilla OS Desktop Image Build'
description: 'Build a Vanilla OS image from a Vib recipe and push it for the runner architecture'
author: 'Vanilla OS Contributors'
branding:
  icon: 'package'
  color: 'orange'

inputs:
  recipe:
    description: 'Path to the vib recipe file'
    required: false
    default: 'recipe.yml'

  image:
    description: 'Target image name (without a tag) (e.g. ghcr.io/owner/my-image)'
    required: true

  base-image:
    description: 'Base image reference in `recipe.yml` to substitute (without a tag)'
    required: true

  base-replacement:
    description: 'Optional base image reference replacement used when building parallel collections (without a tag)'
    required: false

  registry-username:
    description: 'Registry username for authentication'
    required: false

  registry-password:
    description: 'Registry password or token for authentication'
    required: false

outputs:
  digest:
    description: 'Digest of the pushed image'
    value: ${{ steps.push.outputs.digest }}

  image-url:
    description: 'Target image URL (without tag)'
    value: ${{ steps.image-name.outputs.image-url }}

runs:
  using: 'composite'
  steps:
    - name: Verify Base Image Integrity
      if: ${{ github.ref_type == 'tag' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE_IMAGE: ${{ inputs.base-replacement || inputs.base-image }}
      run: |
        OWNER="$(sed -E 's#^[^/]*[.:][^/]*/##; s#/.*##' <<< "$BASE_IMAGE")"
        gh attestation verify "oci://$BASE_IMAGE:latest" --owner "$OWNER"

    - name: Apply base replacement
      if: ${{ inputs.base-replacement != '' }}
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        BASE_IMAGE: ${{ inputs.base-image }}
        BASE_REPLACEMENT: ${{ inputs.base-replacement }}
      run: |
        sed -E "s|$(sed 's/[]\/$*.^[]/\\&/g' <<< "$BASE_IMAGE")(:[^:@/]*)?|${BASE_REPLACEMENT}\1|g" -i "$RECIPE"

    - name: Change tag in recipe
      if: ${{ github.ref_type != 'tag' }}
      shell: bash
      env:
        BASE_IMAGE: ${{ inputs.base-replacement || inputs.base-image }}
        BASE_REF: ${{ github.base_ref }}
        REF_NAME: ${{ github.ref_name }}
        RECIPE: ${{ inputs.recipe }}
      run: |
        if [ -n "$BASE_REF" ]; then
          TAG="$BASE_REF"
        else
          TAG="$REF_NAME"
        fi
        sed -E "s|$(sed 's/[]\/$*.^[]/\\&/g' <<< "$BASE_IMAGE")(:[^:@/]*)?|${BASE_IMAGE}:$TAG|g" -i "$RECIPE"

    - name: Generate image name
      id: image-name
      shell: bash
      env:
        IMAGE_INPUT: ${{ inputs.image }}
        ARCH: ${{ runner.arch }}
      run: |
        IMAGE_URL="$(echo "$IMAGE_INPUT" | tr '[:upper:]' '[:lower:]')"
        echo "IMAGE_URL=$IMAGE_URL" >> "$GITHUB_ENV"
        echo "IMAGE_REGISTRY=${IMAGE_URL%/*}" >> "$GITHUB_ENV"
        echo "IMAGE_NAME=${IMAGE_URL##*/}" >> "$GITHUB_ENV"
        echo "ARCH=${ARCH,,}" >> "$GITHUB_ENV"
        echo "image-url=$IMAGE_URL" >> "$GITHUB_OUTPUT"

    - name: Generate Containerfile
      uses: vanilla-os/vib-gh-action@v1.1.0
      with:
        recipe: ${{ inputs.recipe }}

    - name: Upload Containerfile
      uses: actions/upload-artifact@v7
      with:
        name: Containerfile-${{ env.IMAGE_NAME }}
        path: Containerfile
        overwrite: true

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.IMAGE_URL }}
        labels: org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}

    - name: Get Git commit timestamps
      shell: bash
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

    - name: Login to GitHub Package Registry
      if: ${{ github.event_name != 'pull_request' }}
      uses: redhat-actions/podman-login@v2
      with:
        registry: ${{ env.IMAGE_REGISTRY }}
        username: ${{ inputs.registry-username || github.repository_owner }}
        password: ${{ inputs.registry-password || github.token }}

    - name: Build image
      id: build
      uses: redhat-actions/buildah-build@v3
      with:
        image: ${{ env.IMAGE_URL }}
        containerfiles: Containerfile
        labels: ${{ steps.meta.outputs.labels }}
        layers: true
        oci: true

    - name: Push by digest
      if: ${{ github.event_name != 'pull_request' }}
      id: push
      shell: bash
      run: |
        buildah push \
          --compression-format zstd:chunked \
          --digestfile "${{ runner.temp }}/digest" \
          "${{ steps.build.outputs.image-with-tag }}" \
          "docker://${{ env.IMAGE_URL }}@@unknown-digest@@"
        echo "digest=$(cat "${{ runner.temp }}/digest")" >> "$GITHUB_OUTPUT"

    - name: Export digest
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      env:
        DIGEST: ${{ steps.push.outputs.digest }}
      run: |
        mkdir -p ${{ runner.temp }}/digests
        touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

    - name: Upload digest
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ env.ARCH }}-${{ env.IMAGE_NAME }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
